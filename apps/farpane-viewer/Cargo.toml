[package]
name = "farpane-viewer"
description = "Farpane Viewer: VNC-compatible remote desktop viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "farpane-viewer"
path = "src/main.rs"

[dependencies]
rfb-proto.workspace = true
rfb-codec.workspace = true
rfb-security.workspace = true
rfb-tokio.workspace = true
farpane-ui.workspace = true
tokio = { version = "1.53.3", features = ["rt", "macros", "net", "time", "sync"] }
png = "0.18.1"
eframe = { version = "0.32.3", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts"] }
egui = { version = "0.32.3", default-features = false }
egui-wgpu = "0.32.3"

[lints]
workspace = true

[lib]
name = "farpane_viewer"
path = "src/lib.rs"
