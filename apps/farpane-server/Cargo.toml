[package]
name = "farpane-server"
description = "Farpane Server: VNC-compatible remote desktop server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "farpane-server"
path = "src/main.rs"

[dependencies]
rfb-proto.workspace = true
rfb-codec.workspace = true
rfb-security.workspace = true
rfb-tokio.workspace = true
rfb-server.workspace = true
farpane-x11.workspace = true
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "macros", "signal"] }
farpane-ui.workspace = true
farpane-h264.workspace = true
eframe = { version = "0.33.3", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts", "accesskit"] }
egui = { version = "0.33.3", default-features = false }
egui-wgpu = "0.33.3"
png = "0.18.1"
argon2 = "0.6"
toml = "1.1.8"
rsa = "0.10.0-rc.19"
pkcs8 = { version = "0.11", features = ["pem"] }
serde = { version = "1.0.229", features = ["derive"] }
rcgen = "0.14.7"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
egui_kittest = "0.33"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt", "macros", "net", "time", "io-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
farpane-wayland.workspace = true

[target."cfg(windows)".dependencies]
farpane-win.workspace = true
farpane-session.workspace = true
farpane-winsvc.workspace = true

[lints]
workspace = true

[build-dependencies]
winresource = "0.1.34"
