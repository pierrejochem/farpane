[package]
name = "farpane-server"
description = "Farpane Server: VNC-compatible remote desktop server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "farpane-server"
path = "src/main.rs"

[dependencies]
rfb-proto.workspace = true
rfb-codec.workspace = true
rfb-security.workspace = true
rfb-tokio.workspace = true
rfb-server.workspace = true
farpane-x11.workspace = true
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "macros", "signal"] }
farpane-ui.workspace = true
argon2 = "0.6"
toml = "1.1.8"
serde = { version = "1.0.229", features = ["derive"] }
rcgen = "0.14.7"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt", "macros", "net", "time", "io-util"] }

[lints]
workspace = true
