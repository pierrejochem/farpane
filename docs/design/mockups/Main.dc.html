<style>
body{margin:0;background:#050505}
.theme-glass{--bg:#050505;--text:#f4f4f5;--muted:rgba(255,255,255,.62);--faint:rgba(255,255,255,.5);--line:rgba(255,255,255,.09);--inset:rgba(255,255,255,.05);--inset-hi:rgba(255,255,255,.12);--sel:rgba(255,255,255,.14);--card-bg:linear-gradient(135deg,rgba(255,255,255,.07),transparent 42%),rgba(34,34,37,.5);--card-solid:rgba(26,26,29,.92);--card-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 18px 40px -18px rgba(0,0,0,.8);--blur:blur(22px) saturate(130%);--radius:18px;--accent:#e8492f;--accent-hi:#f4623a;--accent-text:#ff8a73;--btn-bg:linear-gradient(180deg,#f4623a,#e8492f);--btn-fg:#fff;--btn-shadow:0 8px 20px -8px rgba(232,73,47,.8),inset 0 1px 0 rgba(255,255,255,.25);--green:#34d399;--blue:#38bdf8;--amber:#fbbf24;--red:#f87171;--violet:#a78bfa;--switch-off:rgba(255,255,255,.14);--font:Inter,ui-sans-serif,system-ui,sans-serif}

.theme-light{--bg:#f3f4f6;--text:#14171c;--muted:#525b68;--faint:#69727f;--line:#e2e5ea;--inset:#f2f4f7;--inset-hi:#e8ebf0;--sel:#ffffff;--card-bg:#ffffff;--card-solid:#ffffff;--card-shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px -12px rgba(16,24,40,.14);--blur:none;--radius:16px;--accent:#d9432a;--accent-hi:#e8492f;--accent-text:#b5361f;--btn-bg:linear-gradient(180deg,#e8492f,#c93c25);--btn-fg:#fff;--btn-shadow:0 6px 16px -8px rgba(201,60,37,.6);--green:#0f7b55;--blue:#0b69a3;--amber:#9a5b05;--red:#be3a32;--violet:#6d4fd6;--switch-off:#d3d8df;--font:Inter,ui-sans-serif,system-ui,sans-serif}
.scene{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45}
.theme-glass.scene{background:#050505 url(/_blob/5cc1bcf3849c5d846f68d22d68cbb4f3) center/cover no-repeat}
.card{background:var(--card-bg);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--card-shadow);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.card-solid{background:var(--card-solid);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--card-shadow)}
.theme-glass .card-solid{box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 24px 60px -12px rgba(0,0,0,.9);-webkit-backdrop-filter:blur(28px);backdrop-filter:blur(28px)}
.btn-primary{background:var(--btn-bg);color:var(--btn-fg);box-shadow:var(--btn-shadow);border:0;cursor:pointer}
.btn-primary:hover{filter:brightness(1.08)}
.inset{background:var(--inset);border:1px solid var(--line);color:var(--text);cursor:pointer}
.inset:hover{background:var(--inset-hi)}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--inset);border:1px solid var(--line)}
.seg button{padding:5px 12px;border:0;border-radius:7px;background:none;color:var(--muted);font:500 12px var(--font);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--text)}
.theme-light .seg button[aria-pressed="true"]{box-shadow:0 1px 2px rgba(16,24,40,.14)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap;color:var(--tone);background:color-mix(in srgb,var(--tone) 13%,transparent);border:1px solid color-mix(in srgb,var(--tone) 35%,transparent)}

.theme-light.acc-violet{--accent:#7c3aed;--accent-hi:#7c3aed;--accent-text:#6d28d9;--btn-bg:linear-gradient(180deg,#7c3aed,#6d28d9);--btn-fg:#fff;--btn-shadow:0 6px 16px -8px rgba(109,40,217,.6)}
.theme-light.acc-green{--accent:#059669;--accent-hi:#059669;--accent-text:#047857;--btn-bg:linear-gradient(180deg,#059669,#047857);--btn-fg:#fff;--btn-shadow:0 6px 16px -8px rgba(4,120,87,.6)}
.theme-light.acc-amber{--accent:#d97706;--accent-hi:#d97706;--accent-text:#92400e;--btn-bg:linear-gradient(180deg,#f59e0b,#d97706);--btn-fg:#1f1300;--btn-shadow:0 6px 16px -8px rgba(180,83,9,.55)}

</style>

<div class="theme-{{theme}} {{prefCls}} scene" style="min-height: 940px">
<div style="zoom: {{zoom}}; display: flex; flex-wrap: wrap; gap: 18px; max-width: 1320px; margin: 0 auto; padding: 20px; align-items: flex-start; box-sizing: border-box">

    <div style="display: flex; align-items: center; gap: 12px; padding: 0 8px 22px">

      <div><div style="font-weight: 600; font-size: 15px">Farpane Viewer</div><div class="muted" style="font-size: 12px">Remote desktop</div></div>

    <a href="#all" class="nav-a active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>Connections<span class="muted" style="margin-left: auto; font-size: 12px">6</span></a>

    <a href="#recent" class="nav-a"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>Recent</a>
    <a href="#listen" class="nav-a"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12a7 7 0 0 1 14 0M8.5 12a3.5 3.5 0 0 1 7 0"></path><circle cx="12" cy="12" r="1"></circle></svg>Listening<span class="badge t-grey" style="margin-left: auto">Off</span></a>

    <div class="card" style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 16px">
      <form style="display: flex; flex-wrap: wrap; gap: 10px; flex: 1 1 400px">
        <label for="qc" class="vh">Quick connect</label>
        <div class="inset faint" style="flex: 1 1 240px; display: flex; align-items: center; gap: 10px; padding: 0 12px; height: 44px; border-radius: 10px; cursor: text">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>

      <div style="margin-left: auto; display: flex; align-items: center; gap: 10px">

          </sc-for>
        </div>
        <button type="button" class="inset" aria-label="Import connections" style="width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg></button>
      </div>

    <section aria-label="Summary" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px">

          <div style="display: flex; align-items: center; justify-content: space-between">

      </sc-for>
    </section>

    <section class="card" aria-labelledby="conn-h" style="padding: 22px 24px">
      <div style="display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px">
        <div>
          <h1 id="conn-h" style="margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.01em">Saved connections</h1>
          <p class="muted" style="margin: 4px 0 0; font-size: 12.5px">Sorted by last use</p>

        <div role="group" aria-label="Filter" class="seg">
          <button type="button" aria-pressed="true">All</button>
          <button type="button" aria-pressed="false">Encrypted</button>

      </div>

      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px">
        <sc-for list="{{hosts}}" as="h" hint-placeholder-count="6">
          <article class="tile" style="overflow: hidden; display: flex; flex-direction: column">
            <div style="height: 128px; position: relative; background: #121a26; border-bottom: 1px solid var(--line)">
              <div style="position: absolute; inset: 0; background: {{h.wall}}"></div>
              <div style="position: absolute; left: 16px; top: 16px; width: 46%; height: 54%; border-radius: 6px; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.1)"></div>
              <div style="position: absolute; right: 16px; top: 34px; width: 36%; height: 46%; border-radius: 6px; background: rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.1)"></div>
              <span class="mono" style="position: absolute; right: 10px; bottom: 10px; padding: 2px 8px; border-radius: 7px; background: rgba(5,5,5,.75); font-size: 11.5px; color: rgba(255,255,255,.85)">{{h.res}}</span>
            </div>
            <div style="padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px">
              <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
                <h2 style="margin: 0; font-size: 14.5px; font-weight: 600">{{h.name}}</h2>
                <span class="badge {{h.stTone}}"><span class="dot"></span>{{h.state}}</span>
              </div>
              <div class="mono muted" style="font-size: 12.5px">{{h.addr}}</div>
              <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
                <span class="badge {{h.secTone}}">{{h.sec}}</span>
                <span class="faint" style="font-size: 12px">{{h.seen}}</span>
              </div>
              <div style="display: flex; gap: 8px; margin-top: 2px">
                <a href="ViewerSession.dc.html" class="inset" style="flex: 1; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 10px; text-decoration: none; font-size: 13px; font-weight: 600">Connect</a>
                <button type="button" class="inset" aria-label="Edit {{h.name}}" style="width: 44px; height: 40px; border-radius: 10px; display: grid; place-items: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
              </div>
            </div>
          </article>
        </sc-for>
      </div>
    </section>
  </main>
</div>

<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["glass","slate","light","system"],"default":"glass"},"$preview":{"width":1440,"height":940}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { theme: null, sys: 'dark' }; }
  componentDidMount() {
    this.loadPrefs();
    try { this.setState({ osTr: window.matchMedia('(prefers-reduced-transparency: reduce)').matches, osMo: window.matchMedia('(prefers-reduced-motion: reduce)').matches }); } catch (e) {}
    this.onStore = (e) => { if (e.key && e.key.indexOf('farpane-') === 0) this.loadPrefs(); };
    window.addEventListener('storage', this.onStore);
    try {
      this.mq = window.matchMedia('(prefers-color-scheme: light)');
      this.onMq = () => this.setState({ sys: this.mq.matches ? 'light' : 'dark' });
      this.onMq(); this.mq.addEventListener('change', this.onMq);
    } catch (e) {}
  }
  loadPrefs() {
    const g = (k) => { try { return window.localStorage.getItem(k); } catch (e) { return null; } };
    this.setState({ theme: g('farpane-theme') || this.state.theme, accent: g('farpane-accent') || 'default', reduceTr: g('farpane-reduce-tr'), motion: g('farpane-reduce-motion'), scale: g('farpane-scale') || '1' });
  }
  setPref(k, v) {
    try { if (v == null) window.localStorage.removeItem(k); else window.localStorage.setItem(k, v); } catch (e) {}
    this.loadPrefs();
  }
  prefCls() {
    const s = this.state, c = [];
    if (s.accent && s.accent !== 'default') c.push('acc-' + s.accent);
    if (s.reduceTr === 'on' || (s.reduceTr == null && s.osTr)) c.push('reduce-tr');
    if (s.motion === 'on' || (s.motion == null && s.osMo)) c.push('reduce-motion');
    return c.join(' ');
  }
  componentWillUnmount() {
    window.removeEventListener('storage', this.onStore);
    try { this.mq.removeEventListener('change', this.onMq); } catch (e) {}
  }
  pickTheme(t) { this.setState({ theme: t }); try { window.localStorage.setItem('farpane-theme', t); } catch (e) {} }
  renderVals() {
    const pref = this.state.theme ?? this.props.theme ?? 'glass';
    const theme = pref === 'system' ? (this.state.sys === 'light' ? 'light' : 'glass') : pref;
    const stat = (label, value, foot, tone) => ({ label, value, foot, tone });
    const zoom = this.state.scale || '1';
    return {
      theme,
      prefCls: this.prefCls(),
      zoom,
      minH940: Math.round(940 / parseFloat(zoom)) + 'px',
      themeBtns: [['glass', 'Glass'], ['slate', 'Slate'], ['light', 'Light']].map(([id, label]) => ({ label, on: pref === id, pick: () => this.pickTheme(id) })),
      stats: [
        stat('Saved connections', '6', '4 online now', 't-blue'),
        stat('Encrypted', '5 of 6', 'TLS, RA2 or Apple DH', 't-green'),
        stat('Needs attention', '1', 'Password-only server', 't-amber'),
        stat('Last session', '1 h 12 m', 'Build server, today', 't-grey')
      ],
