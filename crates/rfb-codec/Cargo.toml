[package]
name = "rfb-codec"
description = "RFB pixel encoders and decoders (Raw, CopyRect, Hextile, ZRLE, Tight, H.264)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
rfb-proto.workspace = true
jpeg-encoder = { version = "0.7.1", default-features = false }
zune-jpeg = { version = "0.4.21", default-features = false, features = ["std"] }
zune-core = "0.4.12"

[lints]
workspace = true

[dev-dependencies]
proptest = "1.11.0"
