[package]
name = "rfb-security"
description = "RFB security types: None, VNC Auth, VeNCrypt (TLS), RA2/RA2-256, Apple DH"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
aes = "0.9.2"
des = "0.9.0"
eax = "0.6"
getrandom = { version = "0.4.3", features = ["sys_rng"] }
rand_core = "0.10"
rfb-proto.workspace = true
rsa = "0.10.0-rc.19"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
webpki-roots = "1.0.9"

[lints]
workspace = true

[dev-dependencies]
rcgen = "0.14.7"
