[package]
name = "farpane-wayland"
description = "Wayland screen capture and input injection for rfb-server through the xdg-desktop-portal (ScreenCast, RemoteDesktop) and PipeWire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rfb-codec.workspace = true
rfb-proto.workspace = true
rfb-server.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "screencast", "remote_desktop"] }
pipewire = "0.10.1"
tokio = { version = "1.53.3", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }

[dev-dependencies]
x11rb = "0.14.0"

[lints]
workspace = true
