[package]
name = "rfb-server"
description = "Async RFB server: shared framebuffer with damage tracking and one task per client, over pluggable capture and input backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rfb-proto.workspace = true
rfb-codec.workspace = true
rfb-tokio.workspace = true
rustls = { version = "0.23.46", default-features = false, features = ["std"] }
tokio = { version = "1.53.3", features = ["rt", "sync", "time", "net", "macros"] }

[lints]
workspace = true

[dev-dependencies]
rcgen = "0.14.7"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1.53.3", features = ["rt", "macros", "net", "time", "sync", "test-util"] }
