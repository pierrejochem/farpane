[workspace]
resolver = "3"
members = [
    "crates/rfb-proto",
    "crates/rfb-codec",
    "crates/rfb-security",
    "crates/rfb-tokio",
    "crates/rfb-server",
    "crates/farpane-x11",
    "crates/farpane-wayland",
    "crates/farpane-ui",
    "crates/farpane-grab",
    "apps/farpane-viewer",
    "apps/farpane-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0" # TODO: confirm licence before the first release
repository = "https://github.com/OWNER/farpane" # TODO: set once the GitHub organisation exists
authors = ["Pierre Jochem"]

[workspace.dependencies]
bytes = { version = "1", default-features = false }
rfb-proto = { path = "crates/rfb-proto" }
rfb-codec = { path = "crates/rfb-codec" }
rfb-security = { path = "crates/rfb-security" }
rfb-tokio = { path = "crates/rfb-tokio" }
rfb-server = { path = "crates/rfb-server" }
farpane-x11 = { path = "crates/farpane-x11" }
farpane-wayland = { path = "crates/farpane-wayland" }
farpane-ui = { path = "crates/farpane-ui" }
farpane-grab = { path = "crates/farpane-grab" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Password hashing is deliberately heavy; keep it fast enough in debug builds
# and tests.
[profile.dev.package.argon2]
opt-level = 3

# RSA key generation is far too slow unoptimised (seconds), which makes tests
# and debug runs of the RSA-AES handshake crawl.
[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.sha1]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.eax]
opt-level = 3
