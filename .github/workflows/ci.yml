name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - name: X server and PipeWire headers (X11 and Wayland backends)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb tigervnc-standalone-server tigervnc-tools x11-utils x11-apps x11-xserver-utils xclip libpipewire-0.3-dev pkg-config clang
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Docs build without warnings
        if: runner.os == 'Linux'
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked
      - name: OpenH264 (so the H.264 tests run; they skip when it is missing)
        # Cisco's library is downloaded the same way users get it, and checked
        # against Cisco's published hash. If Cisco's server is down the tests
        # skip rather than fail.
        continue-on-error: true
        shell: bash
        run: |
          cargo run -p farpane-server --locked -- h264 install --config-dir "$RUNNER_TEMP/farpane"
          echo "FARPANE_H264_DIR=$RUNNER_TEMP/farpane/h264" >> "$GITHUB_ENV"
      - name: Test
        run: cargo test --workspace --locked
      - name: rfb-proto builds without std
        if: runner.os == 'Linux'
        run: |
          rustup target add thumbv7em-none-eabihf
          cargo build -p rfb-proto --target thumbv7em-none-eabihf --locked

  fuzz:
    # A short run of every fuzz target: catches a parser that panics or
    # hangs on input the proptests did not reach. Long runs are done by hand.
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: "" # cargo-fuzz adds its own flags; warnings are checked by the other job
    steps:
      - uses: actions/checkout@v7
      - name: Nightly toolchain and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/rfb-proto/fuzz
      - name: Fuzz
        working-directory: crates/rfb-proto
        run: |
          for target in messages framing client_conn server_conn; do
            cargo +nightly fuzz run "$target" -- -max_total_time=30
          done
